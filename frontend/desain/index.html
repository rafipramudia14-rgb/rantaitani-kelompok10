<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaniMart — 20 Konsep Desain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;600;700&family=Inter:wght@400;600;800&family=Manrope:wght@400;600;800&family=Nunito:wght@500;700;900&family=Playfair+Display:wght@700;800&family=Space+Grotesk:wght@500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
/* ===== Pemilih desain (bukan bagian desain) */
*{box-sizing:border-box}body{margin:0}
.pemilih{position:sticky;top:0;z-index:99;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#111;color:#fff;font:600 14px/1 system-ui,sans-serif}
.pemilih b{margin-right:8px}.pemilih button{border:1px solid #555;background:#222;color:#fff;border-radius:999px;padding:8px 14px;font:600 13px system-ui;cursor:pointer}
.pemilih button.on{background:#fff;color:#111}.pemilih small{opacity:.7;margin-left:auto}
/* ===== Struktur bersama */
.app{min-height:100vh}
.hdr{display:flex;align-items:center;gap:16px;padding:14px 28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;white-space:nowrap}
.logo img{width:36px;height:36px}
.cari{flex:1;display:flex;align-items:center;gap:8px;padding:12px 18px}
.cari input{border:0;outline:0;background:transparent;flex:1;font:inherit}
.ikon{display:flex;gap:10px}.ikon span{width:42px;height:42px;display:grid;place-items:center;font-size:18px;position:relative}
.ikon span i{position:absolute;top:-4px;right:-4px;font:700 10px system-ui;font-style:normal;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;background:#d64545;color:#fff}
.wadah{max-width:1240px;margin:0 auto;padding:22px 28px 60px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;overflow:hidden;position:relative}
.hero h1{margin:6px 0 10px}.hero p{margin:0 0 18px}
.hero .gbr{height:240px;overflow:hidden;display:grid;place-items:center;font-size:110px}
.hero .gbr img{width:100%;height:100%;object-fit:cover}
.tbl{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;font-weight:700;cursor:pointer;border:0;text-decoration:none}
.label{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.kat{display:flex;gap:12px;overflow-x:auto;padding:22px 0 8px}
.kat a{flex:none;display:grid;justify-items:center;gap:6px;min-width:92px;padding:12px;text-decoration:none;font-weight:600;font-size:13px}
.kat a b{font-size:26px;width:52px;height:52px;display:grid;place-items:center}
.vch{display:flex;gap:10px;overflow-x:auto;padding:6px 0 4px}
.vch div{flex:none;padding:10px 14px;display:grid;gap:2px;font-size:12px}
.vch b{font-size:14px;letter-spacing:.05em}
h2.jdl{margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.kartu{overflow:hidden;display:flex;flex-direction:column;position:relative}
.kartu .f{aspect-ratio:1/1;display:grid;place-items:center;font-size:64px;position:relative;overflow:hidden}
.kartu .f img{width:100%;height:100%;object-fit:cover}
.kartu .isi{padding:12px 14px 14px;display:grid;gap:4px}
.kartu h3{margin:0;font-size:15px;line-height:1.3}
.kartu .hrg{font-weight:800;font-size:18px}.kartu .hrg small{font-size:12px;font-weight:500;opacity:.7}
.kartu .crt{font-size:12px;text-decoration:line-through;opacity:.6}
.kartu .met{font-size:12px;opacity:.75}
.dsk{position:absolute;top:10px;left:10px;font:800 12px system-ui;padding:4px 8px}
.ikl{position:absolute;top:10px;right:10px;font:700 10px system-ui;padding:3px 7px;letter-spacing:.06em}
.toko{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:20px 24px;margin-top:30px}
.toko .av{width:64px;height:64px;display:grid;place-items:center;font-size:30px}
.toko h3{margin:0 0 4px}.toko p{margin:0;font-size:14px}
.kaki{text-align:center;padding:30px;font-size:13px;opacity:.7}

/* ===== 1 · Pasar Pagi (hijau-emas elegan, versi sekarang dipoles) */
.d1{background:#f6f2e8;color:#15301f;font-family:"DM Sans",sans-serif}
.d1 .hdr{background:rgba(255,255,255,.8);backdrop-filter:blur(12px);margin:14px auto 0;max-width:1240px;border-radius:999px;box-shadow:0 10px 30px -14px rgba(21,48,31,.35)}
.d1 .logo{font-family:"Playfair Display",serif;color:#15301f}.d1 .cari{background:#f4efe1;border-radius:999px}
.d1 .ikon span{background:#f4efe1;border-radius:50%}
.d1 .hero{background:linear-gradient(120deg,#1f5a34,#2c6e3f 55%,#b8893a 140%);color:#fff;border-radius:28px;padding:34px}
.d1 .hero h1{font:800 44px/1.05 "Playfair Display",serif}.d1 .hero .label{color:#f3dba0}
.d1 .hero .gbr{border-radius:20px;background:#efe6cc}.d1 .tbl{background:#fff;color:#1f5a34;border-radius:999px}
.d1 .kat a{background:#fff;border:1px solid #e3dccb;border-radius:18px;color:#15301f}.d1 .kat a b{background:#f4efe1;border-radius:50%}
.d1 .vch div{border:1.5px dashed #c9a24d;background:#fffaf0;border-radius:12px}.d1 .vch b{color:#8a5d00}
.d1 h2.jdl{font:700 24px "Playfair Display",serif}
.d1 .kartu{background:#fff;border:1px solid #e3dccb;border-radius:18px}.d1 .kartu .f{background:#efe6cc}
.d1 .hrg{color:#1f5a34}.d1 .dsk{background:#b23a2e;color:#fff;border-radius:8px}.d1 .ikl{background:#fdf1d3;color:#8a5d00;border-radius:6px}
.d1 .toko{background:#fff;border:1px solid #e3dccb;border-radius:22px}.d1 .toko .av{background:linear-gradient(135deg,#1f5a34,#c9a24d);border-radius:50%}

/* ===== 2 · Segar Minimal (putih bersih, hijau terang, banyak ruang) */
.d2{background:#fff;color:#1b1f1d;font-family:"Inter",sans-serif}
.d2 .hdr{border-bottom:1px solid #eef0ee;padding:16px 40px}.d2 .logo{color:#16a34a;letter-spacing:-.02em}
.d2 .cari{border:1.5px solid #e4e7e5;border-radius:12px}.d2 .ikon span{border-radius:12px;background:#f3f5f4}
.d2 .hero{background:#ecfdf3;border-radius:24px;padding:40px}
.d2 .hero h1{font:800 46px/1.05 "Inter";letter-spacing:-.04em}.d2 .label{color:#16a34a}
.d2 .hero .gbr{background:#fff;border-radius:999px;width:240px;justify-self:center;box-shadow:0 30px 60px -30px rgba(22,163,74,.6)}
.d2 .tbl{background:#16a34a;color:#fff;border-radius:12px}
.d2 .kat a{border-radius:14px;color:#1b1f1d}.d2 .kat a b{background:#f3f5f4;border-radius:16px}
.d2 .vch div{background:#f0fdf4;border-radius:10px;color:#166534}.d2 h2.jdl{font:800 22px "Inter";letter-spacing:-.02em}
.d2 .grid{gap:28px 20px}.d2 .kartu .f{background:#f6f7f6;border-radius:18px}.d2 .kartu .isi{padding:12px 2px}
.d2 .hrg{color:#16a34a}.d2 .dsk{background:#16a34a;color:#fff;border-radius:999px}.d2 .ikl{background:#fff;color:#16a34a;border-radius:999px}
.d2 .toko{border:1.5px solid #e4e7e5;border-radius:20px}.d2 .toko .av{background:#ecfdf3;border-radius:16px}

/* ===== 3 · Kampung Hangat (terakota/jingga, ramah, membulat) */
.d3{background:#fff8f1;color:#3b2417;font-family:"Nunito",sans-serif}
.d3 .hdr{background:#e8590c;color:#fff;padding:16px 32px}.d3 .logo img{filter:brightness(0) invert(1)}
.d3 .cari{background:#fff;border-radius:16px;color:#3b2417}.d3 .ikon span{background:rgba(255,255,255,.2);border-radius:16px}
.d3 .hero{background:#ffd8a8;border-radius:32px;padding:34px;border:3px solid #3b2417;box-shadow:8px 8px 0 #3b2417}
.d3 .hero h1{font:900 44px/1.05 "Nunito"}.d3 .label{color:#c2410c}
.d3 .hero .gbr{background:#fff;border-radius:28px;border:3px solid #3b2417}
.d3 .tbl{background:#3b2417;color:#fff;border-radius:16px}
.d3 .kat a{background:#fff;border:2px solid #3b2417;border-radius:20px;color:#3b2417;box-shadow:3px 3px 0 #3b2417}.d3 .kat a b{background:#ffe8cc;border-radius:50%}
.d3 .vch div{background:#fff;border:2px dashed #e8590c;border-radius:14px}.d3 .vch b{color:#c2410c}
.d3 h2.jdl{font:900 26px "Nunito"}
.d3 .kartu{background:#fff;border:2.5px solid #3b2417;border-radius:22px;box-shadow:5px 5px 0 #3b2417}.d3 .kartu .f{background:#ffe8cc}
.d3 .hrg{color:#c2410c}.d3 .dsk{background:#e8590c;color:#fff;border-radius:10px}.d3 .ikl{background:#3b2417;color:#ffd8a8;border-radius:8px}
.d3 .toko{background:#fff;border:2.5px solid #3b2417;border-radius:24px;box-shadow:6px 6px 0 #3b2417}.d3 .toko .av{background:#ffd8a8;border-radius:20px}

/* ===== 4 · Gelap Premium (hutan malam, emas, kaca) */
.d4{background:radial-gradient(1200px 600px at 80% -10%,#1f4d33,#0b1a12 60%);color:#efe9d8;font-family:"Manrope",sans-serif}
.d4 .hdr{border-bottom:1px solid rgba(201,162,77,.25)}.d4 .logo{font-family:"Playfair Display",serif;color:#e8c96a}
.d4 .cari{background:rgba(255,255,255,.06);border:1px solid rgba(201,162,77,.35);border-radius:999px;color:#efe9d8}
.d4 .ikon span{border:1px solid rgba(201,162,77,.35);border-radius:50%}
.d4 .hero{background:rgba(255,255,255,.04);border:1px solid rgba(201,162,77,.3);border-radius:26px;padding:36px;backdrop-filter:blur(8px)}
.d4 .hero h1{font:800 48px/1.04 "Playfair Display",serif;color:#fff}.d4 .label{color:#e8c96a}
.d4 .hero .gbr{border-radius:20px;background:#173826}.d4 .tbl{background:linear-gradient(90deg,#c9a24d,#e8c96a);color:#0b1a12;border-radius:999px}
.d4 .kat a{background:rgba(255,255,255,.05);border:1px solid rgba(201,162,77,.25);border-radius:18px;color:#efe9d8}.d4 .kat a b{background:rgba(201,162,77,.15);border-radius:50%}
.d4 .vch div{border:1px dashed #c9a24d;border-radius:12px;color:#efe9d8}.d4 .vch b{color:#e8c96a}
.d4 h2.jdl{font:700 26px "Playfair Display",serif;color:#fff}
.d4 .kartu{background:rgba(255,255,255,.05);border:1px solid rgba(201,162,77,.22);border-radius:20px}.d4 .kartu .f{background:#173826}
.d4 .hrg{color:#e8c96a}.d4 .dsk{background:#e8c96a;color:#0b1a12;border-radius:8px}.d4 .ikl{background:rgba(0,0,0,.5);color:#e8c96a;border-radius:6px}
.d4 .toko{background:rgba(255,255,255,.05);border:1px solid rgba(201,162,77,.3);border-radius:22px}.d4 .toko .av{background:#173826;border-radius:50%;border:1px solid #c9a24d}

/* ===== 5 · Bold Market (kuning-hitam, blok tegas, huruf besar) */
.d5{background:#fffbea;color:#111;font-family:"Space Grotesk",sans-serif}
.d5 .hdr{background:#111;color:#ffd60a;padding:14px 28px}.d5 .logo img{filter:grayscale(1) brightness(3)}
.d5 .cari{background:#ffd60a;color:#111;font-weight:700}.d5 .ikon span{background:#ffd60a;color:#111}
.d5 .hero{background:#ffd60a;padding:0;grid-template-columns:1fr 1fr;border:4px solid #111}
.d5 .hero>div:first-child{padding:36px}.d5 .hero h1{font:700 60px/.95 "Space Grotesk";text-transform:uppercase;letter-spacing:-.03em}
.d5 .hero .gbr{height:100%;min-height:280px;background:#111;font-size:140px}.d5 .tbl{background:#111;color:#ffd60a;text-transform:uppercase}
.d5 .kat a{background:#fff;border:3px solid #111;color:#111;text-transform:uppercase}.d5 .kat a:hover{background:#ffd60a}
.d5 .vch div{background:#111;color:#ffd60a}.d5 h2.jdl{font:700 34px "Space Grotesk";text-transform:uppercase;letter-spacing:-.02em}
.d5 .grid{gap:0;border-left:3px solid #111;border-top:3px solid #111}
.d5 .kartu{border-right:3px solid #111;border-bottom:3px solid #111;background:#fff}.d5 .kartu .f{background:#fff3b0;border-bottom:3px solid #111}
.d5 .hrg{font-size:22px}.d5 .dsk{background:#111;color:#ffd60a}.d5 .ikl{background:#ffd60a;color:#111;border:2px solid #111}
.d5 .toko{background:#111;color:#fff}.d5 .toko .av{background:#ffd60a}

/* ===== 6 · Laut & Logistik (navy-teal, padat data, fokus pengiriman) */
.d6{background:#eef4f7;color:#0f2a3d;font-family:"IBM Plex Sans",sans-serif}
.d6 .hdr{background:#0f2a3d;color:#fff;padding:12px 28px}.d6 .logo img{filter:brightness(0) invert(1)}
.d6 .cari{background:#fff;border-radius:6px;color:#0f2a3d}.d6 .ikon span{background:#16405e;border-radius:6px}
.d6 .hero{background:#0f2a3d;color:#fff;border-radius:10px;padding:30px;grid-template-columns:1fr 1fr}
.d6 .hero h1{font:700 36px/1.15 "IBM Plex Sans"}.d6 .label{color:#5eead4}
.d6 .hero .gbr{border-radius:8px;background:repeating-linear-gradient(0deg,#16405e 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,#16405e 0 1px,#0f2a3d 1px 28px);font-size:70px}
.d6 .tbl{background:#14b8a6;color:#04231f;border-radius:6px}
.d6 .kat a{background:#fff;border-radius:8px;color:#0f2a3d;border:1px solid #d3e1e9}.d6 .kat a b{font-size:22px}
.d6 .vch div{background:#fff;border:1px solid #14b8a6;border-radius:6px}.d6 .vch b{color:#0d9488}
.d6 h2.jdl{font:700 20px "IBM Plex Sans";text-transform:uppercase;letter-spacing:.06em}
.d6 .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.d6 .kartu{background:#fff;border:1px solid #d3e1e9;border-radius:10px;flex-direction:row}.d6 .kartu .f{width:110px;flex:none;aspect-ratio:auto;font-size:44px;background:#dfeaf0}
.d6 .hrg{color:#0d9488}.d6 .dsk{background:#0f2a3d;color:#5eead4;border-radius:4px;top:6px;left:6px}.d6 .ikl{background:#14b8a6;color:#04231f;border-radius:4px;top:auto;bottom:8px;right:8px}
.d6 .met.kirim{display:block!important;color:#0d9488;font-weight:600}
.d6 .toko{background:#fff;border:1px solid #d3e1e9;border-radius:10px}.d6 .toko .av{background:#dfeaf0;border-radius:8px}

/* ===== 7 · Editorial Koran (serif besar, hitam-putih, foto dominan) */
.d7{background:#f5f1ea;color:#161616;font-family:"DM Sans",sans-serif}
.d7 .hdr{border-bottom:3px double #161616;padding:18px 32px}.d7 .logo{font:800 30px "Fraunces",serif;letter-spacing:-.02em}
.d7 .cari{border-bottom:1.5px solid #161616;border-radius:0;padding:8px 2px}.d7 .ikon span{border:1px solid #161616;border-radius:50%}
.d7 .hero{grid-template-columns:1fr 1.15fr;gap:0;border-bottom:1px solid #161616;padding-bottom:26px}
.d7 .hero>div:first-child{padding-right:30px;border-right:1px solid #161616}.d7 .hero .gbr{height:300px;margin-left:30px;background:#e5dccb;filter:grayscale(.2)}
.d7 .hero h1{font:800 54px/1 "Fraunces",serif;letter-spacing:-.03em}.d7 .label{color:#a3330a}
.d7 .tbl{background:#161616;color:#f5f1ea;border-radius:0}
.d7 .kat a{border-bottom:2px solid transparent;color:#161616;min-width:auto;padding:8px 12px}.d7 .kat a b{display:none}.d7 .kat a:first-child{border-color:#161616}
.d7 .vch div{border:1px solid #161616}.d7 .vch b{font-family:"Fraunces",serif}
.d7 h2.jdl{font:800 30px "Fraunces",serif;border-top:1px solid #161616;padding-top:16px}
.d7 .grid{grid-template-columns:repeat(3,1fr);gap:26px}
.d7 .kartu .f{aspect-ratio:4/3;background:#e5dccb}.d7 .kartu h3{font:700 20px "Fraunces",serif}
.d7 .kartu .isi{padding:10px 0}.d7 .hrg{color:#a3330a}.d7 .dsk{background:#a3330a;color:#fff}.d7 .ikl{background:#f5f1ea;color:#161616;border:1px solid #161616}
.d7 .toko{border:1px solid #161616}.d7 .toko .av{border:1px solid #161616;border-radius:50%}

/* ===== 8 · Kaca Sawah (latar gradasi sawah + kartu kaca buram) */
.d8{background:linear-gradient(160deg,#9fd8a0 0%,#4caf6a 35%,#1d6b45 70%,#0e3b2a 100%) fixed;color:#fff;font-family:"Manrope",sans-serif}
.d8 .hdr{margin:14px auto 0;max-width:1240px;border-radius:22px;background:rgba(255,255,255,.18);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.35)}
.d8 .cari{background:rgba(255,255,255,.22);border-radius:14px;color:#fff}.d8 .cari input::placeholder{color:#eafbe9}
.d8 .ikon span{background:rgba(255,255,255,.2);border-radius:14px}
.d8 .hero,.d8 .kartu,.d8 .toko,.d8 .kat a,.d8 .vch div{background:rgba(255,255,255,.16);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.35);box-shadow:0 20px 40px -20px rgba(0,0,0,.35)}
.d8 .hero{border-radius:28px;padding:34px}.d8 .hero h1{font:800 46px/1.05 "Manrope"}.d8 .label{color:#fffbc2}
.d8 .hero .gbr{border-radius:22px;background:rgba(255,255,255,.25)}.d8 .tbl{background:#fff;color:#1d6b45;border-radius:14px}
.d8 .kat a{border-radius:18px;color:#fff}.d8 .kat a b{background:rgba(255,255,255,.25);border-radius:50%}
.d8 .vch div{border-radius:14px}.d8 h2.jdl{font:800 26px "Manrope"}
.d8 .kartu{border-radius:22px}.d8 .kartu .f{background:rgba(255,255,255,.2)}.d8 .hrg{color:#fffbc2}
.d8 .dsk{background:#ff6b6b;color:#fff;border-radius:10px}.d8 .ikl{background:rgba(0,0,0,.35);color:#fff;border-radius:8px}
.d8 .toko{border-radius:24px}.d8 .toko .av{background:rgba(255,255,255,.25);border-radius:50%}

/* ===== 9 · Batik Nusantara (indigo-marun, pola batik, aksen emas) */
.d9{background-color:#f3ede2;background-image:radial-gradient(circle at 10px 10px,rgba(58,42,110,.09) 3px,transparent 4px),radial-gradient(circle at 30px 30px,rgba(128,32,48,.08) 3px,transparent 4px);background-size:40px 40px;color:#251c3d;font-family:"DM Sans",sans-serif}
.d9 .hdr{background:#2b2160;color:#f3dba0;border-bottom:4px solid #b8893a}.d9 .logo{font-family:"Playfair Display",serif}.d9 .logo img{filter:sepia(1) saturate(3) hue-rotate(5deg)}
.d9 .cari{background:#fff;border-radius:6px;color:#251c3d}.d9 .ikon span{border:1px solid #b8893a;border-radius:6px}
.d9 .hero{background:#7a1f33;color:#fff;border-radius:6px;padding:34px;border:2px solid #b8893a;outline:6px solid #2b2160;outline-offset:-14px}
.d9 .hero h1{font:800 44px/1.05 "Playfair Display",serif;color:#f3dba0}.d9 .label{color:#f3dba0}
.d9 .hero .gbr{background:repeating-conic-gradient(#2b2160 0 25%,#3a2b7a 0 50%) 0 0/36px 36px;border:2px solid #b8893a;border-radius:6px}
.d9 .tbl{background:#b8893a;color:#2b2160;border-radius:4px}
.d9 .kat a{background:#fff;border:1px solid #b8893a;border-radius:6px;color:#2b2160}.d9 .kat a b{background:#efe4f7;border-radius:6px}
.d9 .vch div{background:#2b2160;color:#f3dba0;border-radius:4px}.d9 h2.jdl{font:800 28px "Playfair Display",serif;color:#7a1f33}
.d9 .kartu{background:#fff;border:1px solid #d6c39a;border-radius:6px}.d9 .kartu .f{background:#efe4f7}.d9 .hrg{color:#7a1f33}
.d9 .dsk{background:#7a1f33;color:#f3dba0}.d9 .ikl{background:#2b2160;color:#f3dba0}
.d9 .toko{background:#2b2160;color:#f3dba0;border-radius:6px}.d9 .toko .av{background:#7a1f33;border:2px solid #b8893a;border-radius:6px}

/* ===== 10 · Pastel Lembut (mint, peach, lavender; sangat membulat) */
.d10{background:#fbf7ff;color:#3a3550;font-family:"Nunito",sans-serif}
.d10 .hdr{background:#fff;margin:14px 20px 0;border-radius:30px;box-shadow:0 12px 30px -16px rgba(120,100,180,.4)}.d10 .logo{color:#6d5bd0}
.d10 .cari{background:#f3effc;border-radius:30px}.d10 .ikon span{background:#e8f8f1;border-radius:50%}
.d10 .hero{background:linear-gradient(120deg,#d9f5ea,#ffe3d6 60%,#ece4ff);border-radius:40px;padding:36px}
.d10 .hero h1{font:900 44px/1.05 "Nunito";color:#3a3550}.d10 .label{color:#6d5bd0}

# TaniMart (proyek rantaitani) - Pasar & Informasi Hasil Pertanian (Kelompok 10 - Pertanian)
# Microservices: gateway (Nginx) + layanan-auth (Express) + layanan-lahan (Flask)
#                + layanan-panen (Express) + layanan-penjualan (Flask) + layanan-bantuan (Flask, chatbot)
#                + layanan-info (Flask, harga pangan & produksi) + MySQL
name: rantaitani

services:
  db:
    image: mysql:8.0
    container_name: rantaitani-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql                        # storage persisten
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/info.sql:/docker-entrypoint-initdb.d/02-info.sql:ro
      - ./database/toko.sql:/docker-entrypoint-initdb.d/03-toko.sql:ro
      - ./database/pesanan.sql:/docker-entrypoint-initdb.d/04-pesanan.sql:ro
      - ./database/akun.sql:/docker-entrypoint-initdb.d/05-akun.sql:ro
      - ./database/produk.sql:/docker-entrypoint-initdb.d/06-produk.sql:ro
      - ./database/checkout.sql:/docker-entrypoint-initdb.d/07-checkout.sql:ro
      - ./database/ulasan.sql:/docker-entrypoint-initdb.d/08-ulasan.sql:ro
    networks:
      - tani-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  layanan-auth:
    build: ./layanan-auth
    image: rantaitani/layanan-auth:1.0
    container_name: rantaitani-auth
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${AUTH_DB_USER}
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DB_NAME: db_auth
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tani-net

  layanan-lahan:
    build: ./layanan-lahan
    image: rantaitani/layanan-lahan:1.0
    container_name: rantaitani-lahan
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${LAHAN_DB_USER}
      DB_PASSWORD: ${LAHAN_DB_PASSWORD}
      DB_NAME: db_lahan
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tani-net

  layanan-panen:
    build: ./layanan-panen
    image: rantaitani/layanan-panen:1.0
    container_name: rantaitani-panen
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${PANEN_DB_USER}
      DB_PASSWORD: ${PANEN_DB_PASSWORD}
      DB_NAME: db_panen
      LAHAN_SERVICE_URL: http://layanan-lahan:5000     # komunikasi antar-service via DNS Docker
    volumes:
      - uploads:/data/uploads                          # foto produk
    depends_on:
      db:
        condition: service_healthy
      layanan-lahan:
        condition: service_started
    networks:
      - tani-net

  layanan-penjualan:
    build: ./layanan-penjualan
    image: rantaitani/layanan-penjualan:1.0
    container_name: rantaitani-penjualan
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${PENJUALAN_DB_USER}
      DB_PASSWORD: ${PENJUALAN_DB_PASSWORD}
      DB_NAME: db_penjualan
      PANEN_SERVICE_URL: http://layanan-panen:3000     # cek stok ke layanan-panen
      AUTH_SERVICE_URL: http://layanan-auth:3000       # toko terverifikasi, alamat pembeli, notifikasi
      INFO_SERVICE_URL: http://layanan-info:5000       # hitung ongkir & jalur pengiriman
    depends_on:
      db:
        condition: service_healthy
      layanan-panen:
        condition: service_started
    networks:
      - tani-net

  layanan-bantuan:
    build: ./layanan-bantuan
    image: rantaitani/layanan-bantuan:1.0
    container_name: rantaitani-bantuan
    restart: unless-stopped
    environment:
      PENJUALAN_SERVICE_URL: http://layanan-penjualan:5000   # cek status pembayaran pengguna
    depends_on:
      - layanan-penjualan
    networks:
      - tani-net

  layanan-info:
    build: ./layanan-info
    image: rantaitani/layanan-info:1.0
    container_name: rantaitani-info
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${INFO_DB_USER}
      DB_PASSWORD: ${INFO_DB_PASSWORD}
      DB_NAME: db_info
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tani-net

  gateway:
    image: nginx:1.27-alpine
    container_name: rantaitani-gateway
    restart: unless-stopped
    ports:
      - "0.0.0.0:8090:80"     # satu-satunya port yang dibuka ke host
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - uploads:/usr/share/nginx/uploads:ro              # foto produk dari layanan-panen
    depends_on:
      - layanan-auth
      - layanan-lahan
      - layanan-panen
      - layanan-penjualan
      - layanan-bantuan
      - layanan-info
    networks:
      - tani-net

networks:
  tani-net:
    name: tani-net
    driver: bridge

volumes:
  mysql-data:
    name: rantaitani-mysql-data
  uploads:
    name: rantaitani-uploads

# API Gateway + server frontend RantaiTani
# Setiap request /api/lahan, /api/panen, /api/penjualan dicek dulu ke layanan-auth (auth_request).
# Jika token valid, identitas pengguna diteruskan ke layanan lewat header X-User-*.
# Respons API tidak boleh disimpan di cache browser/tunnel, supaya tabel selalu menampilkan data terbaru
map $uri $cache_api {
    ~^/api/  "no-store";
    default  "";
}

server {
    listen 80;
    server_name _;
    add_header Cache-Control $cache_api always;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS resolver agar nama service selalu ter-resolve
    resolver 127.0.0.11 valid=10s;

    # ---- Pemeriksaan token (internal, tidak bisa dipanggil dari browser)
    location = /_auth {
        internal;
        set $auth http://layanan-auth:3000;
        proxy_pass $auth/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # ---- Login / register / manajemen pengguna (dicek oleh layanan-auth sendiri)
    location /api/auth {
        set $authsvc http://layanan-auth:3000;
        proxy_pass $authsvc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/lahan {
        auth_request /_auth;
        auth_request_set $uid $upstream_http_x_user_id;
        auth_request_set $urole $upstream_http_x_user_role;
        auth_request_set $uname $upstream_http_x_user_name;
        set $lahan http://layanan-lahan:5000;
        proxy_pass $lahan;
        proxy_set_header X-User-Id $uid;
        proxy_set_header X-User-Role $urole;
        proxy_set_header X-User-Name $uname;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/panen {
        auth_request /_auth;
        auth_request_set $uid $upstream_http_x_user_id;
        auth_request_set $urole $upstream_http_x_user_role;
        auth_request_set $uname $upstream_http_x_user_name;
        set $panen http://layanan-panen:3000;
        proxy_pass $panen;
        proxy_set_header X-User-Id $uid;
        proxy_set_header X-User-Role $urole;
        proxy_set_header X-User-Name $uname;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/penjualan {
        auth_request /_auth;
        auth_request_set $uid $upstream_http_x_user_id;
        auth_request_set $urole $upstream_http_x_user_role;
        auth_request_set $uname $upstream_http_x_user_name;
        set $penjualan http://layanan-penjualan:5000;
        proxy_pass $penjualan;
        proxy_set_header X-User-Id $uid;
        proxy_set_header X-User-Role $urole;
        proxy_set_header X-User-Name $uname;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Chatbot bantuan: versi publik (halaman login, tanpa token)
    location /api/bantuan/publik {
        set $bantuan_pub http://layanan-bantuan:5000;
        proxy_pass $bantuan_pub;
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-Name "";
    }

    # ---- Chatbot bantuan: untuk pengguna login (tahu peran & bisa cek status bayar)
    location /api/bantuan {
        auth_request /_auth;
        auth_request_set $uid $upstream_http_x_user_id;
        auth_request_set $urole $upstream_http_x_user_role;
        auth_request_set $uname $upstream_http_x_user_name;
        set $bantuan http://layanan-bantuan:5000;
        proxy_pass $bantuan;
        proxy_set_header X-User-Id $uid;
        proxy_set_header X-User-Role $urole;
        proxy_set_header X-User-Name $uname;
    }

    # ---- Info harga pangan & produksi: versi publik, HANYA baca (tanpa token)
    location /api/info/publik/ {
        limit_except GET { deny all; }
        set $info_pub http://layanan-info:5000;
        proxy_pass $info_pub;
        proxy_set_header X-User-Id "";
        proxy_set_header X-User-Role "";
        proxy_set_header X-User-Name "";
    }

    # ---- Info: CRUD harga pangan (admin, dicek token + peran di layanan-info)
    location /api/info {
        auth_request /_auth;
        auth_request_set $uid $upstream_http_x_user_id;
        auth_request_set $urole $upstream_http_x_user_role;
        auth_request_set $uname $upstream_http_x_user_name;
        set $info http://layanan-info:5000;
        proxy_pass $info;
        proxy_set_header X-User-Id $uid;
        proxy_set_header X-User-Role $urole;
        proxy_set_header X-User-Name $uname;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 401 dari auth_request dikembalikan sebagai JSON
    error_page 401 = @unauthorized;
    location @unauthorized {
        default_type application/json;
        return 401 '{"status":"error","service":"gateway","message":"silakan login terlebih dahulu (token tidak ada / kedaluwarsa)"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
